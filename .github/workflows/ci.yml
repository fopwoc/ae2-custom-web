name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - COPYRIGHT
      - LICENSE
  pull_request:
    paths-ignore:
      - "**/*.md"
      - COPYRIGHT
      - LICENSE

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.8.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
        env:
          VERSION: 0.0.0-ci
      - run: pnpm test
        env:
          VERSION: 0.0.0-ci
      - run: pnpm --filter @ae2-terminal/app exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
        env:
          VERSION: 0.0.0-ci
      - uses: actions/upload-artifact@v4
        with:
          name: ae2-terminal-${{ github.sha }}
          path: apps/terminal/build
          if-no-files-found: error
          retention-days: 14
