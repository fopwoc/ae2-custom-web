name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify semantic tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be an exact semantic version such as 1.2.3" >&2
            exit 1
          fi
          [[ "$(git tag --points-at HEAD --list "$GITHUB_REF_NAME")" == "$GITHUB_REF_NAME" ]]
      - run: sha256sum -c assets/icon-packs/gtnh-2.9.0-beta-2-default.sha256
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: mods/icon-exporter/**/*.gradle*
      - run: ./mods/icon-exporter/gradlew -p mods/icon-exporter build --no-daemon
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/ae2-terminal
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64
      - uses: softprops/action-gh-release@v2
        with:
          files: mods/icon-exporter/build/libs/*.jar
          generate_release_notes: true
